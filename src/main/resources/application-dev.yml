spring:
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# S3 Configuration
aws:
  s3:
    endpoint-url: ${S3_ENDPOINT_URL:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:s3_root_user}
    secret-key: ${S3_SECRET_KEY:s3_root_pass}
    region: ${S3_REGION:eu-central-1}
    bucket-name: ${S3_BUCKET_NAME:habico}